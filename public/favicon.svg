<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5BFF"/>
      <stop offset="0.55" stop-color="#9B2FD6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#FF9F45"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A0B4E" flood-opacity="0.28"/>
    </filter>
    <clipPath id="tile">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 装饰圆必须裁进圆角矩形，不然会糊到透明的四角上 -->
  <g clip-path="url(#tile)">
    <circle cx="86" cy="70" r="140" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="452" cy="462" r="156" fill="#FFFFFF" opacity="0.08"/>
  </g>
  <g transform="rotate(-7 256 256)">
    <rect x="132" y="108" width="248" height="316" rx="30" fill="#FFC93C"/>
    <circle cx="170" cy="146" r="14" fill="#3DDC97"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="152" y="84" width="240" height="328" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="188" y="148" width="136" height="26" rx="13" fill="url(#title)"/>
  <rect x="188" y="206" width="164" height="18" rx="9" fill="#C9CBE3"/>
  <rect x="188" y="252" width="144" height="18" rx="9" fill="#C9CBE3"/>
  <rect x="188" y="298" width="104" height="18" rx="9" fill="#C9CBE3"/>
  <path d="M330 84h46v104l-23-22-23 22z" fill="url(#ribbon)"/>
  <circle cx="360" cy="360" r="26" fill="#3DDC97"/>
  <path d="M349 360l8 9 15-17" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
