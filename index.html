<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>desktop-notebook</title>
    <style>
      :root{
        color-scheme: dark;
        --icon-document:url(@/assets/Document.svg);
        --icon-setting:url(@/assets/Setting.svg);
        --icon-trash:url(@/assets/Trash.svg);
        --icon-graph:url(@/assets/Graph.svg);
        --icon-plus:url(@/assets/Plus.svg);
        --icon-search:url(@/assets/Search.svg);
        --icon-image:url(@/assets/Image.svg);
        --icon-note-link:url(@/assets/NoteLink.svg);
        --icon-save:url(@/assets/Save.svg);
        --icon-focus:url(@/assets/Focus.svg);
        --icon-eye:url(@/assets/Eye.svg);
        --icon-pen:url(@/assets/Pen.svg);
        --icon-typewriter:url(@/assets/Typewriter.svg);
        --icon-map:url(@/assets/Map.svg);
        --icon-clock:url(@/assets/Clock.svg);
        --icon-download:url(@/assets/Download.svg);
        --icon-find:url(@/assets/Find.svg);
        --icon-note:url(@/assets/Note.svg);
        --icon-tag:url(@/assets/Tag.svg);
        --icon-group:url(@/assets/Group.svg);
        --bg-1:#161618;
        --surface-1:#1a1b1f;
        --surface-2:#212228;
        --block-1:#1e1f24;
        --block-2:#26272d;
        --on-accent:#1a1b1e;
        --on-danger:#ffffff;
        --border-1:#2d2e34;
        --border-2:#3c3d44;
        --text-1:#f2f3f5;
        --text-2:#a1a2a8;
        --unhighlight:rgb(194, 194, 194);
        --highlight-1:#e8d531;
        --accent-strong:#e8d531;
        --font-en:'JetBrains Mono', 'Consolas', monospace;
        --overlay-1:rgba(255, 255, 255, 0.03);
        --overlay-2:rgba(255, 255, 255, 0.06);
        --accent-soft:rgba(232, 213, 49, 0.12);
        --accent-border:rgba(232, 213, 49, 0.45);
        --accent:#e8d531;
        --accent-hover:rgba(232, 213, 49, 0.2);
        --accent-glow:rgba(232, 213, 49, 0.3);
        --danger:#ef4444;
        --danger-soft:rgba(239, 68, 68, 0.18);
        --scroll-track:#16171d;
        --scroll-thumb:#3a3b3e;
        --scroll-thumb-hover:#4a4b4e;
        --sticky-soft:rgba(232, 213, 49, 0.16);
        --sticky-soft-hover:rgba(232, 213, 49, 0.24);
        --sticky-border:rgba(232, 213, 49, 0.42);
        --sticky-strong:#e8d531;
        --cal-0:#2a2b30;
        --cal-1:#2f4d34;
        --cal-2:#3c7240;
        --cal-3:#4d9c50;
        --cal-4:#63c05f;
        --radius-1:8px;
        --radius-2:12px;
        --ease:cubic-bezier(0.4, 0, 0.2, 1);
      }
      html[data-theme="light"]{
        color-scheme: light;
        --bg-1:#f3f4f6;
        --surface-1:#ffffff;
        --surface-2:#eceef1;
        --block-1:#ffffff;
        --block-2:#e9ecf1;
        --on-accent:#ffffff;
        --on-danger:#ffffff;
        --border-1:#dfe1e6;
        --border-2:#c6cad2;
        --text-1:#1c1d21;
        --text-2:#666b74;
        --unhighlight:#8a909a;
        --accent-strong:#9c8100;
        --overlay-1:rgba(15, 20, 30, 0.03);
        --overlay-2:rgba(15, 20, 30, 0.06);
        --accent-soft:rgba(232, 213, 49, 0.26);
        --accent-border:rgba(184, 152, 0, 0.55);
        --accent:#9c8100;
        --accent-hover:rgba(156, 129, 0, 0.14);
        --accent-glow:rgba(156, 129, 0, 0.26);
        --danger:#dc2626;
        --danger-soft:rgba(220, 38, 38, 0.12);
        --scroll-track:#eceef1;
        --scroll-thumb:#c3c7ce;
        --scroll-thumb-hover:#a7acb5;
        --sticky-soft:rgba(232, 213, 49, 0.30);
        --sticky-soft-hover:rgba(232, 213, 49, 0.40);
        --sticky-border:rgba(184, 152, 0, 0.5);
        --sticky-strong:#b89800;
        --cal-0:#ebedf0;
        --cal-1:#c6e48b;
        --cal-2:#7bc96f;
        --cal-3:#40c463;
        --cal-4:#1f9f44;
      }
      *{
        margin: 0;
        padding: 0;
      }
      button,input,textarea,select{
        font-family: inherit;
        color: inherit;
      }
      html{
        -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility;
      }
      #app,body,html{
        width: 100%;
        height: 100%;
        background-color: var(--bg-1);
        overflow: hidden;
      }
      body{
        color: var(--text-1);
        font-size: 15px;
        font-family:-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      ::selection{
        background: rgba(232, 213, 49, 0.28);
        color: var(--text-1);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      [tabindex]:focus-visible{
        outline: 2px solid var(--highlight-1);
        outline-offset: 2px;
      }
      *::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }

      *::-webkit-scrollbar-track {
          background: var(--scroll-track);
      }

      *::-webkit-scrollbar-thumb {
          background: var(--scroll-thumb);
          border-radius: 3px;
      }

      *::-webkit-scrollbar-thumb:hover {
          background: var(--scroll-thumb-hover);
      }
      .card-dropdown.el-popper{
        background: var(--block-1);
        border: 1px solid var(--border-1);
        border-radius: var(--radius-1);
        box-shadow: none;
        padding: 4px;
      }
      .card-dropdown .el-dropdown-menu{
        background: transparent;
        padding: 0;
      }
      .card-dropdown .el-dropdown-menu__item{
        color: var(--text-1);
        font-size: 14px;
        border-radius: var(--radius-1);
        padding: 8px 14px;
      }
      .card-dropdown .el-dropdown-menu__item:not(.is-disabled):hover{
        color: var(--accent-strong);
        background: var(--accent-soft);
      }
      .card-dropdown .el-dropdown-menu__item--divided{
        border-top: 1px solid var(--border-1);
        margin-top: 4px;
      }
      .card-dropdown .el-dropdown-menu__item.menu-danger{
        color: #ff4d4f;
        font-weight: 500;
      }
      .card-dropdown .el-dropdown-menu__item.menu-danger:not(.is-disabled):hover{
        color: #ffffff;
        background: #ff4d4f;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
