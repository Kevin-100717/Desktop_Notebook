<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>desktop-notebook</title>
    <style>
      :root{
        --icon-document:url(@/assets/Document.svg);
        --icon-setting:url(@/assets/Setting.svg);
        --bg-1:#161618;
        --highlight-1:#e8d531;
        --unhighlight:rgb(194, 194, 194);
        --font-en:'JetBrains Mono', 'Consolas', monospace
      }
      *{
        margin: 0;
        padding: 0;
      }
      #app,body,html{
        width: 100%;
        height: 100%;
        background-color: var(--bg-1);
        overflow: hidden;
      }
      *::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }

      *::-webkit-scrollbar-track {
          background: #16171d;
      }

      *::-webkit-scrollbar-thumb {
          background: #3a3b3e;
          border-radius: 3px;
      }

      *::-webkit-scrollbar-thumb:hover {
          background: #4a4b4e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
